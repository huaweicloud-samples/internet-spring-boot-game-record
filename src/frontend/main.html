<div id="main">
  <div id="main-user">
    <div class="section-header">参与者名称</div>
    <div id="usernamef" class="field"><input name="user" ng-model="username"></div>
  </div>
  <div id="main-session">
    <div class="section-header">场次</div>
    <div id="sessionnamef" class="field"><input name="name" ng-model="sessionname"></div>
    <div id="create" class="button" ng-click="createSession(sessionname, username)">创建</div>
    <div id="sessionid" class="field"><input name="sessionid" ng-model="sessionid" placeholder="场次编号"></div>
    <div id="join" class="button" ng-click="joinSession(sessionid, username)">加入</div>
  </div>
</div>
